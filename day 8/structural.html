<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1:first-child{
            background-color:yellow ;
        }
        h1:last_child{
            background-color: blueviolet ;
        }
        h1:nth-child(odd){
            background-color: chocolate;
        }
        h1:first-of-type{
            background-color: green;
        }
        h1:last-of-type{
            background-color: beige;
        }
    </style>
</head>
<body>
   <h1>heading1</h1>
   <h1>heading2</h1>
   <h1>heading3</h1>
   <h1>heading4</h1>
   <h1>heading5</h1>

</body>
</html>
