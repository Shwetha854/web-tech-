<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1::after{
            content: "hari";
        }
        h1::before{
            content: "roopa";
        }
        h1::first-letter{
            color: red;
        }
        h1::first-line{
            color: black;
            background-color: brown;
        }
        /*marker*/
        
        
        
        li::marker{
            content: "";
        }
        h1::selection{
            background-color:aqua;
            color:blue;
        }

    </style>
</head>
<body>
    <h1> weds </h1>
    
    

    
    
</body>
</html>
